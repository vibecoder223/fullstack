<!doctype html><meta charset="utf-8"><title>fullstack demo</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#141413;color:#f0efea;font:16px system-ui,sans-serif}
.c{border:1px solid #2e2e2b;border-radius:14px;padding:36px 48px;min-width:340px}
h1{font-size:20px;font-weight:500;margin:0 0 4px}
p{margin:0 0 20px;color:#9a988f;font-size:14px}
pre{background:#1e1e1c;border:1px solid #2e2e2b;border-radius:8px;padding:14px;font-size:13px;margin:0}
</style>
<div class="c">
<h1>frontend v1</h1><p>response from the api container</p>
<pre id="out">loading...</pre>
</div>
<script>
fetch("/api/status.json").then(r=>r.json())
 .then(d=>out.textContent=JSON.stringify(d,null,2))
 .catch(e=>out.textContent="api unreachable: "+e);
</script>
